<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d1b69">
<title>King James 2</title>

<!--
  Cache-busting: every URL carries ?v=<BUILD>. Bump by running
  `node scripts/bump_build.js` before each deploy, or it will remain
  the same and browsers will keep serving stale cached JS/CSS.
-->

<!-- Styles (order doesn't matter much, but we group logically) -->
<link rel="stylesheet" href="styles/base.css?v=16">
<link rel="stylesheet" href="styles/animations.css?v=16">
<link rel="stylesheet" href="styles/hud.css?v=16">
<link rel="stylesheet" href="styles/castle.css?v=16">
<link rel="stylesheet" href="styles/scene.css?v=16">
<link rel="stylesheet" href="styles/battle.css?v=16">
<link rel="stylesheet" href="styles/character.css?v=16">
</head>
<body>

<div id="app"></div>

<!--
  Script load order MATTERS.
  1) Engine foundation   2) Engine systems   3) Engine UI
  4) Data catalogs       5) Data quests      6) Boot (last)
-->

<!-- 1. Engine foundation -->
<script src="engine/constants.js?v=16"></script>
<script src="engine/events.js?v=16"></script>
<script src="engine/registry.js?v=16"></script>
<script src="engine/state.js?v=16"></script>
<script src="engine/profiles.js?v=16"></script>
<script src="engine/audio.js?v=16"></script>
<script src="engine/effects.js?v=16"></script>
<script src="engine/statuses.js?v=16"></script>
<script src="engine/traits.js?v=16"></script>

<!-- 2. Engine systems -->
<script src="engine/scene.js?v=16"></script>
<script src="engine/combat.js?v=16"></script>

<!-- 3. Engine UI renderers -->
<script src="engine/ui/hud.js?v=16"></script>
<script src="engine/ui/castle.js?v=16"></script>
<script src="engine/ui/map.js?v=16"></script>
<script src="engine/ui/character.js?v=16"></script>
<script src="engine/ui/gear-chest.js?v=16"></script>
<script src="engine/ui/ally-room.js?v=16"></script>
<script src="engine/ui/trophy-hall.js?v=16"></script>
<script src="engine/ui/levelup.js?v=16"></script>
<script src="engine/ui/library.js?v=16"></script>
<script src="engine/ui/armory.js?v=16"></script>
<script src="engine/ui/debug.js?v=16"></script>
<script src="engine/ui/joker.js?v=16"></script>
<!-- Scene-type renderers (each registers with Registry.sceneTypes) -->
<script src="engine/ui/choice.js?v=16"></script>
<script src="engine/ui/dialogue.js?v=16"></script>
<script src="engine/ui/puzzle.js?v=16"></script>
<script src="engine/ui/battle.js?v=16"></script>
<script src="engine/ui/ending.js?v=16"></script>

<!-- 4. Data catalogs (order: types before consumers; quests last) -->
<script src="data/types.js?v=16"></script>
<script src="data/moves.js?v=16"></script>
<script src="data/gear.js?v=16"></script>
<script src="data/allies.js?v=16"></script>
<script src="data/enemies.js?v=16"></script>
<script src="data/treasures.js?v=16"></script>
<script src="data/regions.js?v=16"></script>
<script src="data/traits.js?v=16"></script>
<script src="data/badges.js?v=16"></script>
<script src="data/crown-dialogue.js?v=16"></script>
<script src="data/scrolls.js?v=16"></script>

<!-- 5. Quests (data). Adding a new quest = one new file + one <script src> here. -->
<script src="data/quests/intro.js?v=16"></script>
<script src="data/quests/forest.js?v=16"></script>
<script src="data/quests/mountain.js?v=16"></script>
<script src="data/quests/beach.js?v=16"></script>
<script src="data/quests/desert.js?v=16"></script>
<script src="data/quests/volcano.js?v=16"></script>

<!-- 6. Boot (runs after DOMContentLoaded to mount the game) -->
<script src="engine/boot.js?v=16"></script>
</body>
</html>
