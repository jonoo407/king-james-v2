<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#fde2a7"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#a4161a"/>
    </linearGradient>
    <radialGradient id="wheel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="500" cy="80" r="35" fill="#fff5b8" opacity="0.9">
    <animate attributeName="r" values="35;38;35" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Distant clouds (drifting) -->
  <g opacity="0.85">
    <g>
      <ellipse cx="0" cy="70" rx="40" ry="12" fill="#ffffff"/>
      <ellipse cx="20" cy="62" rx="28" ry="10" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="translate"
        values="-100,0; 700,0" dur="22s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="120" rx="50" ry="14" fill="#ffffff"/>
      <ellipse cx="25" cy="110" rx="32" ry="11" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="translate"
        values="-150,0; 750,0" dur="30s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ground -->
  <rect y="330" width="600" height="70" fill="#3a8a3a"/>
  <rect y="328" width="600" height="6" fill="#2c6e2c"/>

  <!-- Road -->
  <rect y="320" width="600" height="20" fill="#555"/>

  <!-- Road dashes (moving to suggest motion) -->
  <g fill="#fff">
    <rect x="0" y="328" width="40" height="4">
      <animate attributeName="x" values="600;-60" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="328" width="40" height="4">
      <animate attributeName="x" values="720;60" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="240" y="328" width="40" height="4">
      <animate attributeName="x" values="840;180" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="360" y="328" width="40" height="4">
      <animate attributeName="x" values="960;300" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="480" y="328" width="40" height="4">
      <animate attributeName="x" values="1080;420" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pelican + bicycle: gentle bob -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-3; 0,0; 0,-2; 0,0" dur="0.9s" repeatCount="indefinite"/>

    <!-- Bicycle -->
    <g transform="translate(300,255)">
      <!-- Rear wheel -->
      <g transform="translate(-65,40)">
        <circle r="38" fill="url(#wheel)"/>
        <circle r="32" fill="none" stroke="#222" stroke-width="2"/>
        <circle r="5" fill="#999"/>
        <g stroke="#bbb" stroke-width="1.5">
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
          <line x1="0" y1="-32" x2="0" y2="32"/>
          <line x1="-32" y1="0" x2="32" y2="0"/>
          <line x1="-22" y1="-22" x2="22" y2="22"/>
          <line x1="-22" y1="22" x2="22" y2="-22"/>
        </g>
      </g>

      <!-- Front wheel -->
      <g transform="translate(65,40)">
        <circle r="38" fill="url(#wheel)"/>
        <circle r="32" fill="none" stroke="#222" stroke-width="2"/>
        <circle r="5" fill="#999"/>
        <g stroke="#bbb" stroke-width="1.5">
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
          <line x1="0" y1="-32" x2="0" y2="32"/>
          <line x1="-32" y1="0" x2="32" y2="0"/>
          <line x1="-22" y1="-22" x2="22" y2="22"/>
          <line x1="-22" y1="22" x2="22" y2="-22"/>
        </g>
      </g>

      <!-- Frame -->
      <g stroke="url(#frame)" stroke-width="6" fill="none" stroke-linecap="round">
        <line x1="-65" y1="40" x2="0" y2="40"/>
        <line x1="0" y1="40" x2="-15" y2="-10"/>
        <line x1="-65" y1="40" x2="-15" y2="-10"/>
        <line x1="0" y1="40" x2="40" y2="-15"/>
        <line x1="40" y1="-15" x2="65" y2="40"/>
        <line x1="-15" y1="-10" x2="-25" y2="-25"/>
      </g>

      <!-- Seat -->
      <ellipse cx="-25" cy="-27" rx="12" ry="4" fill="#222"/>

      <!-- Handlebars -->
      <line x1="40" y1="-15" x2="55" y2="-30" stroke="#222" stroke-width="4" stroke-linecap="round"/>
      <line x1="55" y1="-30" x2="70" y2="-30" stroke="#222" stroke-width="4" stroke-linecap="round"/>
      <line x1="55" y1="-30" x2="40" y2="-30" stroke="#222" stroke-width="4" stroke-linecap="round"/>

      <!-- Pedal crank (rotating) -->
      <g transform="translate(0,40)">
        <circle r="6" fill="#888"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="18" stroke="#444" stroke-width="3"/>
          <line x1="0" y1="0" x2="0" y2="-18" stroke="#444" stroke-width="3"/>
          <rect x="-6" y="16" width="12" height="4" fill="#222"/>
          <rect x="-6" y="-20" width="12" height="4" fill="#222"/>
        </g>
      </g>
    </g>

    <!-- Pelican -->
    <g transform="translate(285,200)">
      <!-- Tail feathers -->
      <path d="M -55,15 Q -75,5 -70,30 Q -60,28 -50,22 Z" fill="#e8e8e8" stroke="#999" stroke-width="1"/>

      <!-- Body -->
      <ellipse cx="0" cy="15" rx="48" ry="32" fill="#ffffff" stroke="#bbb" stroke-width="1.5"/>

      <!-- Wing (flapping subtly) -->
      <g transform="translate(-5,5)">
        <animateTransform attributeName="transform" type="rotate"
          values="-3 -5 5; 4 -5 5; -3 -5 5" dur="0.9s" repeatCount="indefinite"
          additive="sum"/>
        <path d="M -5,5 Q 10,-5 30,5 Q 25,20 5,22 Q -10,18 -5,5 Z"
          fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
        <path d="M 5,10 L 20,12 M 5,15 L 22,17 M 5,20 L 18,22"
          stroke="#bbb" stroke-width="0.8" fill="none"/>
      </g>

      <!-- Neck -->
      <path d="M 30,0 Q 38,-15 45,-25 Q 50,-20 42,-5 Q 38,5 30,5 Z"
        fill="#ffffff" stroke="#bbb" stroke-width="1.5"/>

      <!-- Head -->
      <circle cx="48" cy="-30" r="16" fill="#ffffff" stroke="#bbb" stroke-width="1.5"/>

      <!-- Eye -->
      <circle cx="54" cy="-33" r="3" fill="#222"/>
      <circle cx="55" cy="-34" r="1" fill="#fff"/>

      <!-- Beak (upper) -->
      <path d="M 60,-28 Q 92,-25 95,-18 Q 90,-20 60,-22 Z"
        fill="#ffb84d" stroke="#cc7a00" stroke-width="1"/>

      <!-- Beak pouch (lower, wobbling) -->
      <path d="M 60,-22 Q 80,-10 92,-18 Q 88,-14 78,-12 Q 68,-12 60,-18 Z"
        fill="#ffd699" stroke="#cc7a00" stroke-width="1">
        <animate attributeName="d"
          values="M 60,-22 Q 80,-10 92,-18 Q 88,-14 78,-12 Q 68,-12 60,-18 Z;
                  M 60,-22 Q 80,-6 92,-18 Q 88,-12 78,-8 Q 68,-8 60,-18 Z;
                  M 60,-22 Q 80,-10 92,-18 Q 88,-14 78,-12 Q 68,-12 60,-18 Z"
          dur="1.4s" repeatCount="indefinite"/>
      </path>

      <!-- Tiny tongue line on beak -->
      <line x1="62" y1="-22" x2="88" y2="-19" stroke="#cc7a00" stroke-width="0.6"/>

      <!-- Helmet -->
      <path d="M 35,-37 Q 50,-52 64,-37 Q 60,-42 50,-43 Q 40,-42 35,-37 Z"
        fill="#1d4ed8" stroke="#0b2a7a" stroke-width="1"/>
      <rect x="42" y="-46" width="6" height="3" fill="#facc15"/>

      <!-- Legs (pedaling) -->
      <g transform="translate(-5,40)">
        <!-- Front leg -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-30;30;-30" dur="0.6s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="20" stroke="#ffb84d" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="2" cy="22" rx="6" ry="3" fill="#ffb84d"/>
        </g>
        <!-- Back leg -->
        <g transform="translate(-8,0)">
          <animateTransform attributeName="transform" type="rotate"
            values="30;-30;30" dur="0.6s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="20" stroke="#ffa733" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="2" cy="22" rx="6" ry="3" fill="#ffa733"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="100" y1="220" x2="140" y2="220">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="245" x2="125" y2="245">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="110" y1="275" x2="150" y2="275">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
